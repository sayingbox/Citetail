<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog — CiteTail</title>
<meta name="description" content="News, guides and analysis on GEO, AEO and AI search visibility from the CiteTail team.">

<style>

    :root {
        --bg: #f7f7f3;
        --surface: #ffffff;
        --text: #111111;
        --muted: #6f716c;
        --border: #dedfd9;
        --accent: #a8ff3e;
        --accent-text: #2b3d0d;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, Helvetica, sans-serif;
        line-height: 1.6;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    /* ===============================
       HEADER
    =============================== */

    header {
        width: 100%;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
    }

    .header-inner {
        max-width: 1180px;
        margin: auto;
        padding: 22px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.04em;
    }

    .logo span {
        font-weight: 400;
    }

    .back {
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
    }

    /* ===============================
       HERO
    =============================== */

    .hero {
        max-width: 1180px;
        margin: auto;
        padding: 90px 30px 50px;
    }

    .eyebrow {
        display: inline-block;
        padding: 6px 12px;
        margin-bottom: 24px;
        background: var(--accent);
        color: var(--accent-text);
        border-radius: 4px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    h1 {
        margin: 0;
        font-size: clamp(40px, 6vw, 64px);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 700;
    }

    .hero-description {
        max-width: 620px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.55;
    }

    /* ===============================
       CATEGORY FILTER
    =============================== */

    .filter-bar {
        max-width: 1180px;
        margin: auto;
        padding: 0 30px 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .filter-pill {
        padding: 9px 18px;
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        background: var(--surface);
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .filter-pill:hover {
        border-color: var(--text);
        color: var(--text);
    }

    .filter-pill.active {
        background: var(--text);
        border-color: var(--text);
        color: var(--bg);
    }

    /* ===============================
       FEATURED POST
    =============================== */

    .featured-wrapper {
        max-width: 1180px;
        margin: auto;
        padding: 0 30px 30px;
    }

    .featured-card {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 40px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 40px;
    }

    .featured-image {
        width: 100%;
        aspect-ratio: 16 / 11;
        border-radius: 6px;
        background: var(--border);
        object-fit: cover;
        display: block;
    }

    .featured-category {
        display: inline-block;
        padding: 5px 11px;
        background: var(--accent);
        color: var(--accent-text);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 16px;
    }

    .featured-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.15;
        margin: 0 0 14px;
    }

    .featured-excerpt {
        font-size: 16px;
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 20px;
    }

    .featured-meta {
        font-size: 13px;
        color: var(--muted);
    }

    /* ===============================
       POST GRID
    =============================== */

    .grid-wrapper {
        max-width: 1180px;
        margin: auto;
        padding: 20px 30px 100px;
    }

    .section-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0 0 24px;
    }

    .post-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
    }

    .post-card {
        display: block;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .post-card:hover {
        border-color: var(--text);
        transform: translateY(-2px);
    }

    .post-image {
        width: 100%;
        aspect-ratio: 16 / 10;
        background: var(--border);
        object-fit: cover;
        display: block;
    }

    .post-body {
        padding: 22px 22px 24px;
    }

    .post-category {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--accent-text);
        margin-bottom: 12px;
    }

    .post-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin: 0 0 10px;
    }

    .post-excerpt {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 16px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .post-meta {
        font-size: 12px;
        color: var(--muted);
    }

    .state-message {
        padding: 60px 0;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        grid-column: 1 / -1;
    }

    /* ===============================
       FOOTER
    =============================== */

    footer {
        max-width: 1180px;
        margin: auto;
        padding: 35px 30px 70px;
        border-top: 1px solid var(--border);
    }

    footer p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
    }

    /* ===============================
       MOBILE
    =============================== */

    @media (max-width: 900px) {

        .post-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .featured-card {
            grid-template-columns: 1fr;
        }

    }

    @media (max-width: 620px) {

        .header-inner {
            padding: 18px 20px;
        }

        .hero {
            padding: 60px 20px 35px;
        }

        .hero-description {
            font-size: 17px;
        }

        .filter-bar {
            padding: 0 20px 30px;
        }

        .featured-wrapper,
        .grid-wrapper {
            padding-left: 20px;
            padding-right: 20px;
        }

        .featured-card {
            padding: 24px;
        }

        .featured-title {
            font-size: 24px;
        }

        .post-grid {
            grid-template-columns: 1fr;
        }

        footer {
            padding-left: 20px;
            padding-right: 20px;
        }

    }

</style>
</head>


<body>


<header>
    <div class="header-inner">
        <a href="/" class="logo">Cite<span>Tail</span></a>
        <a href="/" class="back">← Home</a>
    </div>
</header>


<section class="hero">
    <div class="eyebrow">Blog</div>
    <h1>Notes on getting cited by AI.</h1>
    <p class="hero-description">
        Guides, research and case studies on GEO, AEO and staying visible
        as search moves inside the answer.
    </p>
</section>


<div class="filter-bar" id="filter-bar">
    <button class="filter-pill active" data-category="all">All posts</button>
</div>


<div class="featured-wrapper" id="featured-wrapper"></div>


<div class="grid-wrapper">
    <p class="section-label">Recent posts</p>
    <div class="post-grid" id="post-grid">
        <div class="state-message">Loading posts…</div>
    </div>
</div>


<footer>
    <p>© CiteTail — Be the answer AI gives first.</p>
</footer>


<script>

    /*
    =====================================================
    CONFIG — fill these in with your GitHub details
    =====================================================
    */

    const GITHUB_OWNER = "sayingbox";
    const GITHUB_REPO = "Citetail";
    const GITHUB_BRANCH = "main";
    const POSTS_PATH = "content/posts";


    /*
    =====================================================
    CATEGORY → URL PREFIX
    (matches vercel.json rewrites)
    =====================================================
    */

    function getPostUrl(category, slug) {

        const normalized = (category || "").toLowerCase().trim();

        if (normalized === "case study" || normalized === "case-study") {
            return `/case-study/${slug}`;
        }

        if (normalized === "report") {
            return `/report/${slug}`;
        }

        if (normalized === "guide") {
            return `/guide/${slug}`;
        }

        return `/blog/${slug}`;

    }


    /*
    =====================================================
    FRONTMATTER PARSER
    =====================================================
    */

    function parseFrontmatter(text) {

        const data = {};

        text.split("\n").forEach(line => {

            const separator = line.indexOf(":");

            if (separator === -1) {
                return;
            }

            const key = line.substring(0, separator).trim();
            let value = line.substring(separator + 1).trim();
            value = value.replace(/^["']|["']$/g, "");

            data[key] = value;

        });

        return data;

    }


    function formatDate(value) {

        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (isNaN(date)) {
            return value;
        }

        return date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

    }


    function excerptFrom(post) {

        return post.metaDescription || "";

    }


    /*
    =====================================================
    FETCH LIST OF POST FILES FROM GITHUB
    =====================================================
    */

    async function listPostFiles() {

        const apiUrl =
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${POSTS_PATH}?ref=${GITHUB_BRANCH}`;

        const response = await fetch(apiUrl);

        if (!response.ok) {
            throw new Error("Could not list posts from GitHub");
        }

        const files = await response.json();

        return files
            .filter(f => f.name.endsWith(".md"))
            .map(f => f.name.replace(/\.md$/, ""));

    }


    /*
    =====================================================
    FETCH AND PARSE A SINGLE POST
    =====================================================
    */

    async function loadPost(slug) {

        const response = await fetch(`/${POSTS_PATH}/${slug}.md`);

        if (!response.ok) {
            return null;
        }

        const markdown = await response.text();

        const match = markdown.match(/^---\s*([\s\S]*?)\s*---/);

        if (!match) {
            return null;
        }

        const frontmatter = parseFrontmatter(match[1]);

        return {
            slug: frontmatter.slug || slug,
            title: frontmatter.title || "Untitled",
            category: frontmatter.category || "Blog",
            date: frontmatter.date || "",
            image: frontmatter.image || "",
            metaDescription: frontmatter.metaDescription || ""
        };

    }


    /*
    =====================================================
    RENDER
    =====================================================
    */

    function renderFilters(categories, activeCategory, onSelect) {

        const bar = document.getElementById("filter-bar");
        bar.innerHTML = "";

        const all = document.createElement("button");
        all.className = "filter-pill" + (activeCategory === "all" ? " active" : "");
        all.textContent = "All posts";
        all.addEventListener("click", () => onSelect("all"));
        bar.appendChild(all);

        categories.forEach(cat => {

            const pill = document.createElement("button");
            pill.className = "filter-pill" + (activeCategory === cat ? " active" : "");
            pill.textContent = cat;
            pill.addEventListener("click", () => onSelect(cat));
            bar.appendChild(pill);

        });

    }


    function renderFeatured(post) {

        const wrapper = document.getElementById("featured-wrapper");

        if (!post) {
            wrapper.innerHTML = "";
            return;
        }

        const url = getPostUrl(post.category, post.slug);
        const imageSrc = post.image || "";

        wrapper.innerHTML = `
            <a href="${url}" class="featured-card">
                <img class="featured-image" src="${imageSrc}" alt="${post.title}" onerror="this.style.display='none'">
                <div>
                    <div class="featured-category">${post.category}</div>
                    <h2 class="featured-title">${post.title}</h2>
                    <p class="featured-excerpt">${excerptFrom(post)}</p>
                    <div class="featured-meta">${formatDate(post.date)}</div>
                </div>
            </a>
        `;

    }


    function renderGrid(posts) {

        const grid = document.getElementById("post-grid");

        if (!posts.length) {
            grid.innerHTML = '<div class="state-message">No posts in this category yet.</div>';
            return;
        }

        grid.innerHTML = posts.map(post => {

            const url = getPostUrl(post.category, post.slug);
            const imageSrc = post.image || "";

            return `
                <a href="${url}" class="post-card">
                    <img class="post-image" src="${imageSrc}" alt="${post.title}" onerror="this.style.display='none'">
                    <div class="post-body">
                        <div class="post-category">${post.category}</div>
                        <h3 class="post-title">${post.title}</h3>
                        <p class="post-excerpt">${excerptFrom(post)}</p>
                        <div class="post-meta">${formatDate(post.date)}</div>
                    </div>
                </a>
            `;

        }).join("");

    }


    /*
    =====================================================
    MAIN
    =====================================================
    */

    async function init() {

        const grid = document.getElementById("post-grid");

        try {

            const slugs = await listPostFiles();

            const posts = (await Promise.all(slugs.map(loadPost)))
                .filter(Boolean)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            if (!posts.length) {
                grid.innerHTML = '<div class="state-message">No posts published yet.</div>';
                renderFeatured(null);
                return;
            }

            const categories = [...new Set(posts.map(p => p.category))];

            let activeCategory = "all";

            function applyFilter(category) {

                activeCategory = category;

                const filtered = category === "all"
                    ? posts
                    : posts.filter(p => p.category === category);

                renderFeatured(activeCategory === "all" ? posts[0] : filtered[0] || null);

                const rest = activeCategory === "all"
                    ? filtered.slice(1)
                    : filtered.slice(activeCategory === "all" ? 1 : 0);

                renderGrid(activeCategory === "all" ? filtered.slice(1) : filtered);

                renderFilters(categories, activeCategory, applyFilter);

            }

            applyFilter("all");

        } catch (error) {

            console.error("Blog index error:", error);

            grid.innerHTML =
                '<div class="state-message">Couldn\'t load posts. Check the GITHUB_OWNER / GITHUB_REPO config in blog-index.html.</div>';

        }

    }

    init();

</script>


</body>
</html>
