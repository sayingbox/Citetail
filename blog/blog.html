<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CiteTail Blog</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <h1 id="title">Loading...</h1>

    <p>
        <strong>Slug:</strong>
        <span id="slug"></span>
    </p>

    <p>
        <strong>Category:</strong>
        <span id="category"></span>
    </p>

    <p>
        <strong>Date:</strong>
        <span id="date"></span>
    </p>

    <p>
        <strong>Meta Title:</strong>
        <span id="metaTitle"></span>
    </p>

    <p>
        <strong>Meta Description:</strong>
        <span id="metaDescription"></span>
    </p>

    <hr>

    <h2>Blog Content</h2>

    <div id="content">
        Loading content...
    </div>


    <script>

        async function loadBlogPost() {

            /*
                Supported URLs:

                /blog/seo-vs-geo
                /case-study/seo-vs-geo
                /report/seo-vs-geo
                /guide/seo-vs-geo

                All of them load:

                /content/posts/seo-vs-geo.md
            */


            const path = window.location.pathname;

            const parts = path
                .split("/")
                .filter(Boolean);


            // Get the last part of the URL
            const slug = parts[parts.length - 1];


            // Get category/path type
            const urlCategory =
                parts.length > 1
                    ? parts[parts.length - 2]
                    : "";


            if (!slug) {

                document.getElementById("title")
                    .textContent =
                    "No blog slug found";

                return;
            }


            /*
                Markdown files are always stored here:

                /content/posts/{slug}.md
            */

            const postUrl =
                `/content/posts/${slug}.md`;


            console.log("Current URL:", path);
            console.log("URL Category:", urlCategory);
            console.log("Slug:", slug);
            console.log("Markdown:", postUrl);


            try {

                const response =
                    await fetch(postUrl);


                if (!response.ok) {

                    throw new Error(
                        "Could not find " + postUrl
                    );

                }


                const markdown =
                    await response.text();


                console.log(
                    "Markdown:",
                    markdown
                );


                /*
                    Separate frontmatter
                    from Markdown content
                */

                const frontmatterMatch =
                    markdown.match(
                        /^---\s*([\s\S]*?)\s*---/
                    );


                let frontmatter = {};

                let content = markdown;


                if (frontmatterMatch) {

                    frontmatter =
                        parseFrontmatter(
                            frontmatterMatch[1]
                        );


                    content =
                        markdown
                            .replace(
                                frontmatterMatch[0],
                                ""
                            )
                            .trim();

                }


                /*
                    Display frontmatter
                */

                document.getElementById("title")
                    .textContent =
                    frontmatter.title ||
                    "No title";


                document.getElementById("slug")
                    .textContent =
                    frontmatter.slug ||
                    slug;


                document.getElementById("category")
                    .textContent =
                    frontmatter.category ||
                    "";


                document.getElementById("date")
                    .textContent =
                    frontmatter.date ||
                    "";


                document.getElementById("metaTitle")
                    .textContent =
                    frontmatter.metaTitle ||
                    "";


                document.getElementById("metaDescription")
                    .textContent =
                    frontmatter.metaDescription ||
                    "";


                /*
                    Convert Markdown into HTML
                */

                document.getElementById("content")
                    .innerHTML =
                    marked.parse(content);


            } catch (error) {

                console.error(error);


                document.getElementById("title")
                    .textContent =
                    "Blog post not found";


                document.getElementById("content")
                    .textContent =
                    error.message;

            }

        }



        /*
            URL logic

            ONLY these categories get
            their own URL:

            case study → /case-study/post
            report     → /report/post
            guide      → /guide/post

            Everything else:

            → /blog/post
        */

        function getPostUrl(post) {

            const category =
                (post.category || "")
                    .toLowerCase()
                    .trim();


            const slug =
                post.slug;


            if (category === "case study") {

                return `/case-study/${slug}`;

            }


            if (category === "report") {

                return `/report/${slug}`;

            }


            if (category === "guide") {

                return `/guide/${slug}`;

            }


            // Default URL
            return `/blog/${slug}`;

        }



        /*
            Parse Markdown frontmatter
        */

        function parseFrontmatter(text) {

            const data = {};


            text.split("\n").forEach(line => {

                const separator =
                    line.indexOf(":");


                if (separator === -1) {

                    return;

                }


                const key =
                    line
                        .substring(
                            0,
                            separator
                        )
                        .trim();


                let value =
                    line
                        .substring(
                            separator + 1
                        )
                        .trim();


                // Remove quotes

                value =
                    value.replace(
                        /^["']|["']$/g,
                        ""
                    );


                data[key] = value;

            });


            return data;

        }



        // Load the post

        loadBlogPost();

    </script>

</body>
</html>
