<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CiteTail Blog</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <h1 id="title">Loading...</h1>

    <p>
        <strong>Slug:</strong>
        <span id="slug"></span>
    </p>

    <p>
        <strong>Category:</strong>
        <span id="category"></span>
    </p>

    <p>
        <strong>Date:</strong>
        <span id="date"></span>
    </p>

    <p>
        <strong>Meta Title:</strong>
        <span id="metaTitle"></span>
    </p>

    <p>
        <strong>Meta Description:</strong>
        <span id="metaDescription"></span>
    </p>

    <hr>

    <h2>Blog Content</h2>

    <div id="content">
        Loading content...
    </div>


    <script>

        /*
        =====================================================
        GET SLUG FROM URL
        =====================================================

        Supported URLs:

        /blog/seo-vs-geo
        /case-study/seo-vs-geo
        /report/seo-vs-geo
        /guide/seo-vs-geo

        All URLs load:

        /content/posts/seo-vs-geo.md
        */


        function getSlugFromUrl() {

            const path =
                window.location.pathname;

            const parts =
                path
                    .split("/")
                    .filter(Boolean);

            if (parts.length === 0) {
                return "";
            }

            return parts[parts.length - 1];

        }


        /*
        =====================================================
        GET URL CATEGORY
        =====================================================
        */

        function getUrlCategory() {

            const path =
                window.location.pathname;

            const parts =
                path
                    .split("/")
                    .filter(Boolean);

            if (parts.length < 2) {
                return "blog";
            }

            return parts[parts.length - 2];

        }


        /*
        =====================================================
        LOAD BLOG POST
        =====================================================
        */

        async function loadBlogPost() {

            const slug =
                getSlugFromUrl();

            const urlCategory =
                getUrlCategory();


            if (!slug) {

                document.getElementById("title")
                    .textContent =
                    "No blog slug found";

                return;

            }


            /*
            IMPORTANT:

            Pages CMS saves posts here:

            content/posts/

            Therefore every blog post is loaded from:

            /content/posts/{slug}.md
            */


            const postUrl =
                `/content/posts/${slug}.md`;


            console.log("Current URL:",
                window.location.pathname);

            console.log("URL Category:",
                urlCategory);

            console.log("Slug:",
                slug);

            console.log("Markdown file:",
                postUrl);


            try {

                const response =
                    await fetch(postUrl);


                if (!response.ok) {

                    throw new Error(
                        "Could not find blog post: " +
                        postUrl
                    );

                }


                const markdown =
                    await response.text();


                console.log(
                    "Markdown:",
                    markdown
                );


                /*
                =================================================
                PARSE FRONTMATTER
                =================================================
                */

                const frontmatterMatch =
                    markdown.match(
                        /^---\s*([\s\S]*?)\s*---/
                    );


                let frontmatter = {};

                let content = markdown;


                if (frontmatterMatch) {

                    frontmatter =
                        parseFrontmatter(
                            frontmatterMatch[1]
                        );


                    content =
                        markdown
                            .replace(
                                frontmatterMatch[0],
                                ""
                            )
                            .trim();

                }


                /*
                =================================================
                DISPLAY BLOG INFORMATION
                =================================================
                */

                const title =
                    frontmatter.title ||
                    "No title";


                const postSlug =
                    frontmatter.slug ||
                    slug;


                const category =
                    frontmatter.category ||
                    "";


                const date =
                    frontmatter.date ||
                    "";


                const metaTitle =
                    frontmatter.metaTitle ||
                    "";


                const metaDescription =
                    frontmatter.metaDescription ||
                    "";


                document.getElementById("title")
                    .textContent =
                    title;


                document.getElementById("slug")
                    .textContent =
                    postSlug;


                document.getElementById("category")
                    .textContent =
                    category;


                document.getElementById("date")
                    .textContent =
                    date;


                document.getElementById("metaTitle")
                    .textContent =
                    metaTitle;


                document.getElementById("metaDescription")
                    .textContent =
                    metaDescription;


                /*
                =================================================
                SET PAGE SEO TITLE
                =================================================
                */

                document.title =
                    metaTitle ||
                    title ||
                    "CiteTail Blog";


                /*
                =================================================
                SET META DESCRIPTION
                =================================================
                */

                let descriptionTag =
                    document.querySelector(
                        'meta[name="description"]'
                    );


                if (!descriptionTag) {

                    descriptionTag =
                        document.createElement("meta");

                    descriptionTag.setAttribute(
                        "name",
                        "description"
                    );

                    document.head.appendChild(
                        descriptionTag
                    );

                }


                descriptionTag.setAttribute(
                    "content",
                    metaDescription
                );


                /*
                =================================================
                CONVERT MARKDOWN → HTML
                =================================================
                */

                document.getElementById("content")
                    .innerHTML =
                    marked.parse(content);


            } catch (error) {

                console.error(
                    "Blog loading error:",
                    error
                );


                document.getElementById("title")
                    .textContent =
                    "Blog post not found";


                document.getElementById("content")
                    .textContent =
                    error.message;

            }

        }


        /*
        =====================================================
        BLOG URL LOGIC
        =====================================================

        Category:

        case study → /case-study/post
        report     → /report/post
        guide      → /guide/post

        Everything else:

        → /blog/post
        */


        function getPostUrl(post) {

            const category =
                (post.category || "")
                    .toLowerCase()
                    .trim();


            const slug =
                post.slug;


            if (category === "case study") {

                return `/case-study/${slug}`;

            }


            if (category === "report") {

                return `/report/${slug}`;

            }


            if (category === "guide") {

                return `/guide/${slug}`;

            }


            return `/blog/${slug}`;

        }


        /*
        =====================================================
        PARSE PAGES CMS FRONTMATTER
        =====================================================
        */

        function parseFrontmatter(text) {

            const data = {};


            text.split("\n")
                .forEach(line => {

                    const separator =
                        line.indexOf(":");


                    if (separator === -1) {

                        return;

                    }


                    const key =
                        line
                            .substring(
                                0,
                                separator
                            )
                            .trim();


                    let value =
                        line
                            .substring(
                                separator + 1
                            )
                            .trim();


                    /*
                    Remove surrounding quotes
                    */

                    value =
                        value.replace(
                            /^["']|["']$/g,
                            ""
                        );


                    data[key] =
                        value;

                });


            return data;

        }


        /*
        =====================================================
        START
        =====================================================
        */

        loadBlogPost();

    </script>

</body>
</html>
