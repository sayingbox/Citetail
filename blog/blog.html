<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CiteTail Blog</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <h1 id="title">Loading...</h1>

    <p>
        <strong>Slug:</strong>
        <span id="slug"></span>
    </p>

    <p>
        <strong>Category:</strong>
        <span id="category"></span>
    </p>

    <p>
        <strong>Date:</strong>
        <span id="date"></span>
    </p>

    <p>
        <strong>Meta Title:</strong>
        <span id="metaTitle"></span>
    </p>

    <p>
        <strong>Meta Description:</strong>
        <span id="metaDescription"></span>
    </p>

    <hr>

    <h2>Blog Content</h2>

    <div id="content">
        Loading content...
    </div>


    <script>

        async function loadBlogPost() {

            // Example:
            // https://citetail.com/blog/seo-vs-geo

            const path = window.location.pathname;

            const parts = path
                .split("/")
                .filter(Boolean);

            const slug = parts[parts.length - 1];


            if (!slug || slug === "blog") {

                document.getElementById("title").textContent =
                    "No blog slug found";

                return;

            }


            // Your actual Markdown location
            const postUrl =
                `/content/posts/${slug}.md`;


            console.log("Loading:", postUrl);


            try {

                const response =
                    await fetch(postUrl);


                if (!response.ok) {

                    throw new Error(
                        "Could not find " + postUrl
                    );

                }


                const markdown =
                    await response.text();


                console.log(
                    "Markdown:",
                    markdown
                );


                // Separate frontmatter from content

                const frontmatterMatch =
                    markdown.match(
                        /^---\s*([\s\S]*?)\s*---/
                    );


                let frontmatter = {};

                let content = markdown;


                if (frontmatterMatch) {

                    frontmatter =
                        parseFrontmatter(
                            frontmatterMatch[1]
                        );

                    content =
                        markdown
                            .replace(
                                frontmatterMatch[0],
                                ""
                            )
                            .trim();

                }


                // Show raw frontmatter data

                document.getElementById("title")
                    .textContent =
                    frontmatter.title || "No title";


                document.getElementById("slug")
                    .textContent =
                    frontmatter.slug || slug;


                document.getElementById("category")
                    .textContent =
                    frontmatter.category || "";


                document.getElementById("date")
                    .textContent =
                    frontmatter.date || "";


                document.getElementById("metaTitle")
                    .textContent =
                    frontmatter.metaTitle || "";


                document.getElementById("metaDescription")
                    .textContent =
                    frontmatter.metaDescription || "";


                // Convert Markdown to HTML

                document.getElementById("content")
                    .innerHTML =
                    marked.parse(content);


            } catch (error) {

                console.error(error);

                document.getElementById("title")
                    .textContent =
                    "Blog post not found";

                document.getElementById("content")
                    .textContent =
                    error.message;

            }

        }


        function parseFrontmatter(text) {

            const data = {};


            text.split("\n").forEach(line => {

                const separator =
                    line.indexOf(":");


                if (separator === -1) {
                    return;
                }


                const key =
                    line
                        .substring(0, separator)
                        .trim();


                let value =
                    line
                        .substring(separator + 1)
                        .trim();


                // Remove quotes

                value =
                    value.replace(
                        /^["']|["']$/g,
                        ""
                    );


                data[key] = value;

            });


            return data;

        }


        loadBlogPost();

    </script>

</body>
</html>
